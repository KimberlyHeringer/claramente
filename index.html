<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>claramente</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1 class="site-title">claramente</h1>
    <button id="theme-toggle" title="Alternar tema">🌙</button>
  </header>

  <main>
    <input type="text" id="search-input" placeholder="🔎 Buscar link...">

    <div id="category-filter">
      <button data-category="all">Todas</button>
      <button data-category="cursos">Cursos</button>
      <button data-category="vídeos">Vídeos</button>
      <button data-category="páginas">Páginas</button>
      <button data-category="melhorar habilidades">Melhorar habilidades</button>
    </div>

    <div id="link-list">
      <div id="cursos" class="category-block">
        <h3>cursos</h3>
        <ul></ul>
      </div>
      <div id="vídeos" class="category-block">
        <h3>vídeos</h3>
        <ul></ul>
      </div>
      <div id="páginas" class="category-block">
        <h3>Páginas</h3>
        <ul></ul>
        </div>
        <div id="melhorar habilidades" class="category-block">
          <h3>Melhorar habilidades</h3>
          <ul></ul>
      </div>
    </div>
  </main>

  <!-- Formulário do Admin (oculto) -->
<div id="admin-login" class="hidden">
  <h2>Área Administrativa</h2>
  <form id="login-form">
    <input type="text" id="admin-user" placeholder="Usuário" required />
    <input type="password" id="admin-pass" placeholder="Senha" required />
    <button type="submit">Entrar</button>
  </form>
</div>

<!-- Formulário para adicionar links (também oculto inicialmente) -->
<div id="admin-panel" class="hidden">
<button id="export-links">⬇️ Exportar Links</button>
<button id="import-links">⬆️ Importar Links</button>
<input type="file" id="import-file" accept=".json" style="display: none;">
  <h2>Adicionar Link</h2>
  <form id="link-form">
    <input type="text" id="link-title" placeholder="Título do link" required />
    <input type="url" id="link-url" placeholder="URL do link" required />
    <select id="link-category">
      <option value="cursos">Cursos</option>
      <option value="vídeos">Vídeos</option>
      <option value="páginas">Páginas</option>
      <option value="melhorar habilidades">melhorar habilidades</option>
    </select>
    <button type="submit">Adicionar</button>
  </form>
</div>
  <form id="meuFormulario">
  <label for="nome">Nome:</label>
  <input type="text" id="nome" name="nome" required><br>

  <label for="email">Email:</label>
  <input type="email" id="email" name="email" required><br>

  <label for="mensagem">Mensagem:</label>
  <textarea id="mensagem" name="mensagem" required></textarea><br>

  <button type="submit">Enviar</button>
</form>

<p id="statusEnvio"></p>


  <script src="script.js"></script>
</body>
</html>
